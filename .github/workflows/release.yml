name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release metadata
        run: |
          # The tag, package version, changelog entry, and main branch must agree.
          node scripts/set-version.mjs --check
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME does not match package.json"; exit 1; }

          version="${GITHUB_REF_NAME#v}"
          grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "CHANGELOG.md has no dated section for $version"; exit 1; }

          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "tag $GITHUB_REF_NAME is not reachable from main"; exit 1; }

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck source
        run: pnpm typecheck

      - name: Typecheck tests
        run: pnpm typecheck:test

      - name: Check JavaScript tooling
        run: node --check scripts/set-version.mjs

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Inspect package contents
        run: pnpm pack --dry-run

      - name: Publish to npm
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            pnpm publish --no-git-checks --provenance --access public --tag next
          else
            pnpm publish --no-git-checks --provenance --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep this prerelease check in sync with the npm dist-tag above.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --prerelease --latest=false
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
