name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release metadata
        run: |
          # actions/checkout rewrites the pushed tag as a lightweight tag, so
          # fetch it again to restore the annotated tag object.
          git fetch --force --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          # The tag, package version, changelog entry, and main branch must agree.
          git fetch --no-tags origin main:refs/remotes/origin/main
          node scripts/verify-release.mjs --ci

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check
        run: pnpm check

      - name: Inspect package contents
        run: pnpm pack --dry-run

      - name: Publish to npm
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            pnpm publish --no-git-checks --provenance --access public --tag next
          else
            pnpm publish --no-git-checks --provenance --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep this prerelease check in sync with the npm dist-tag above.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --prerelease --latest=false
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
