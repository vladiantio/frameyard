<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      #text {
        position: absolute;
        inset: 0;
        background: #f4efe6;
        color: #101820;
        font:
          700 42px/1.4 ui-monospace,
          monospace;
        padding: 64px;
      }
      #text span {
        display: inline-block;
        margin: 0 14px 18px 0;
      }
      #line {
        position: absolute;
        left: 0;
        top: 0;
        height: 12px;
        background: #e4572e;
      }
    </style>
  </head>
  <body>
    <fy-composition width="1920" height="1080" fps="30" duration-in-frames="90">
      <div id="text"></div>
      <div id="line"></div>
    </fy-composition>
    <script type="text/fy-controller">
      let line;
      export default {
        mount({ root }) {
          const text = root.querySelector("#text");
          text.innerHTML = Array.from(
            { length: 90 },
            (_, index) => `<span>frame ${String(index + 1).padStart(2, "0")}</span>`,
          ).join("");
          line = root.querySelector("#line");
        },
        update({ frame }) {
          const t = frame / 89;
          line.style.width = `${120 + t * 1600}px`;
          line.style.transform = `translate(${64 + t * 120}px, ${880 - t * 300}px)`;
        },
        dispose() {
          line = undefined;
        },
      };
    </script>
  </body>
</html>
