<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      #gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <fy-composition width="1920" height="1080" fps="30" duration-in-frames="90">
      <canvas id="gl" width="1920" height="1080"></canvas>
    </fy-composition>
    <script type="text/fy-controller">
      let gl;
      let frameLocation;
      let resolutionLocation;

      const vertexSource = `
        attribute vec2 a_position;
        void main() {
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `;

      const fragmentSource = `
        precision mediump float;
        uniform float u_frame;
        uniform vec2 u_resolution;
        void main() {
          vec2 uv = gl_FragCoord.xy / u_resolution;
          float t = u_frame / 89.0;
          vec3 color = vec3(
            0.5 + 0.5 * sin(uv.x * 6.28318 + t * 3.0),
            0.5 + 0.5 * cos(uv.y * 6.28318 + t * 2.0),
            0.5 + 0.5 * sin((uv.x + uv.y) * 6.28318 + t)
          );
          gl_FragColor = vec4(color, 1.0);
        }
      `;

      function compile(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(shader) ?? "Could not compile the WebGL shader.");
        }
        return shader;
      }

      export default {
        mount({ root }) {
          const canvas = root.querySelector("#gl");
          gl = canvas.getContext("webgl", {
            alpha: false,
            antialias: false,
            preserveDrawingBuffer: true,
          });
          if (!gl) {
            throw new Error("WebGL is unavailable.");
          }

          const program = gl.createProgram();
          gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
          gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program) ?? "Could not link the WebGL program.");
          }
          gl.useProgram(program);

          const buffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
          const position = gl.getAttribLocation(program, "a_position");
          gl.enableVertexAttribArray(position);
          gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

          frameLocation = gl.getUniformLocation(program, "u_frame");
          resolutionLocation = gl.getUniformLocation(program, "u_resolution");
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
        },
        update({ frame }) {
          gl.uniform1f(frameLocation, frame);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        },
        dispose() {
          gl = undefined;
          frameLocation = undefined;
          resolutionLocation = undefined;
        },
      };
    </script>
  </body>
</html>
