<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #05070d;
      }
      fy-composition {
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .scene {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(1200px 760px at 72% 34%, rgba(42, 104, 220, 0.5), transparent 62%),
          radial-gradient(860px 620px at 18% 82%, rgba(255, 76, 140, 0.14), transparent 64%),
          linear-gradient(145deg, #060a12 0%, #0b1424 52%, #05070d 100%);
      }
      .grid {
        position: absolute;
        inset: -1px;
        background-image:
          linear-gradient(rgba(150, 190, 255, 0.075) 1px, transparent 1px),
          linear-gradient(90deg, rgba(150, 190, 255, 0.075) 1px, transparent 1px);
        background-size: 72px 72px;
      }
      .fade {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 58% 38%, transparent 18%, rgba(5, 7, 13, 0.55) 62%, rgba(5, 7, 13, 0.92) 100%),
          linear-gradient(90deg, rgba(5, 7, 13, 0.5), transparent 38%, transparent 74%, rgba(5, 7, 13, 0.55));
      }
      .ring {
        position: absolute;
        left: 58%;
        top: 44%;
        width: 1060px;
        height: 1060px;
        border: 1px solid rgba(160, 205, 255, 0.18);
        border-radius: 50%;
        box-shadow:
          0 0 140px rgba(54, 118, 255, 0.16) inset,
          0 0 90px rgba(54, 118, 255, 0.08);
        transform: translate(-50%, -50%);
      }
      .ring::before,
      .ring::after {
        content: "";
        position: absolute;
        border: 1px solid rgba(255, 118, 190, 0.13);
        border-radius: 50%;
      }
      .ring::before {
        inset: 138px;
      }
      .ring::after {
        inset: 286px;
        border-color: rgba(255, 179, 71, 0.12);
      }
    </style>
  </head>
  <body>
    <fy-composition width="1920" height="1080" fps="30" duration-in-frames="180">
      <div class="scene">
        <div class="grid"></div>
        <div class="ring"></div>
        <div class="fade"></div>
      </div>
    </fy-composition>
  </body>
</html>
