<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="application/json" data-fy="props">
      {
        "title": "Frameyard",
        "subtitle": "Deterministic video, authored with the web platform.",
        "accent": "#b8f36b"
      }
    </script>
    <style>
      @keyframes orbit {
        from {
          transform: rotate(0deg) translateX(210px) rotate(0deg);
        }
        to {
          transform: rotate(360deg) translateX(210px) rotate(-360deg);
        }
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.12);
        }
      }
      @keyframes title-in {
        from {
          opacity: 0;
          transform: translateY(46px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes subtitle-in {
        from {
          opacity: 0;
          transform: translateY(26px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes scene-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      html,
      body,
      fy-composition {
        background: #080a0d;
      }
      #scene {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080a0d;
        color: #eef2f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        animation: scene-out 1s linear both;
      }
      #field {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #orb {
        position: absolute;
        top: 46%;
        left: 38%;
        width: 460px;
        height: 460px;
        margin: -230px 0 0 -230px;
        border-radius: 50%;
        background: var(--fy-prop-accent);
        filter: blur(110px);
        opacity: 0.28;
        animation: orbit 30s linear infinite;
      }
      #glow {
        position: absolute;
        top: 8%;
        right: 6%;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: var(--fy-prop-accent);
        filter: blur(90px);
        animation: breathe 9s ease-in-out infinite;
      }
      #rail {
        position: absolute;
        top: 92px;
        left: 160px;
        right: 160px;
        height: 1px;
        background: rgba(255, 255, 255, 0.14);
      }
      #eyebrow {
        position: absolute;
        top: 64px;
        left: 160px;
        font:
          600 14px/1 ui-monospace,
          monospace;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--fy-prop-accent);
      }
      #meta {
        position: absolute;
        top: 64px;
        right: 160px;
        font:
          500 14px/1 ui-monospace,
          monospace;
        letter-spacing: 0.12em;
        color: #788595;
      }
      #copy {
        position: absolute;
        left: 160px;
        top: 236px;
        width: 1320px;
      }
      #title {
        margin: 0;
        font-size: 156px;
        line-height: 0.92;
        letter-spacing: -0.055em;
        font-weight: 680;
        opacity: 0;
        animation: title-in 1s cubic-bezier(0.215, 0.61, 0.355, 1) both;
      }
      #subtitle {
        margin: 34px 0 0;
        max-width: 820px;
        font-size: 31px;
        line-height: 1.45;
        color: #96a2b2;
        font-weight: 420;
        opacity: 0;
        animation: subtitle-in 1s cubic-bezier(0.215, 0.61, 0.355, 1) both;
      }
      #signal {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 1920px;
        height: 1080px;
        overflow: visible;
      }
      #caption {
        position: absolute;
        left: 160px;
        bottom: 92px;
        font:
          500 13px/1 ui-monospace,
          monospace;
        letter-spacing: 0.16em;
        color: #7e8b9b;
      }
      #caption strong {
        color: var(--fy-prop-accent);
        font-weight: 600;
      }
      #progress-track {
        position: absolute;
        left: 160px;
        right: 160px;
        bottom: 72px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
      }
      #progress {
        position: absolute;
        inset: 0 auto 0 0;
        width: calc(var(--fy-progress) * 100%);
        background: var(--fy-prop-accent);
        box-shadow: 0 0 18px var(--fy-prop-accent);
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 48%, rgba(0, 0, 0, 0.42) 100%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <fy-composition width="1920" height="1080" fps="30" duration-in-frames="900">
      <div id="scene" data-fy-anim-start="824" data-fy-anim-duration="70" data-fy-anim-easing="linear">
        <canvas id="field" width="1920" height="1080"></canvas>
        <div id="orb"></div>
        <div id="glow"></div>
        <div id="vignette"></div>
        <div id="rail"></div>
        <div id="eyebrow">Frameyard / Field Notes</div>
        <div id="meta">1920×1080 · 30 FPS · 30.00 S</div>
        <div id="copy">
          <h1
            id="title"
            data-fy-text="title"
            data-fy-anim-start="0"
            data-fy-anim-duration="52"
            data-fy-anim-easing="cubic-bezier(0.215, 0.61, 0.355, 1)"
          ></h1>
          <p
            id="subtitle"
            data-fy-text="subtitle"
            data-fy-anim-start="26"
            data-fy-anim-duration="62"
            data-fy-anim-easing="cubic-bezier(0.215, 0.61, 0.355, 1)"
          ></p>
        </div>
        <svg id="signal" viewBox="0 0 1920 1080" fill="none" aria-hidden="true">
          <path
            id="signal-path"
            stroke="var(--fy-prop-accent)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity=".82"
          ></path>
          <g id="signal-bars"></g>
        </svg>
        <div id="caption">FRAME <strong id="frame">000</strong> / 899 · SEEK-SAFE CANVAS + SVG + CSS</div>
        <div id="progress-track"><div id="progress"></div></div>
      </div>

      <audio src="assets/chime.wav" data-fy-start="18" data-fy-volume="0.5"></audio>
      <audio src="assets/chime.wav" data-fy-start="300" data-fy-volume="0.38"></audio>
      <audio src="assets/chime.wav" data-fy-start="600" data-fy-volume="0.42"></audio>
      <audio src="assets/chime.wav" data-fy-start="840" data-fy-volume="0.55"></audio>
    </fy-composition>

    <script type="text/fy-controller" src="./demo.controller.js"></script>
  </body>
</html>
